buildscript {
    repositories {
        flatDir {
            dirs "libs"
        }
        mavenCentral()
        maven {
            name = "forge"
            url = "https://files.minecraftforge.net/maven"
        }
        maven {
            name = "forge2"
            url = "https://maven.minecraftforge.net"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath(
            ':ForgeGradle:1.2-SNAPSHOT',
            'de.oceanlabs.mcp:RetroGuard:3.6.6',
            'com.github.jponge:lzma-java:1.3',
            'net.md-5:SpecialSource:1.7.3',
            'org.apache.httpcomponents:httpclient:4.3.3',
            'org.apache.httpcomponents:httpmime:4.3.3',
            'com.github.abrarsyed.jastyle:jAstyle:1.2',
            'net.sf.trove4j:trove4j:2.1.0',
            'com.nothome:javaxdelta:2.0.1',
            'com.google.code.gson:gson:2.2.4',
            'com.google.guava:guava:18.0',
            'net.sf.opencsv:opencsv:2.3',
            'org.ow2.asm:asm-debug-all:5.0.3',
            'de.oceanlabs.mcp:mcinjector:3.2-SNAPSHOT',
            'com.github.tony19:named-regexp:0.2.3',
            'com.cloudbees:diff4j:1.1'
        )
    }
}

apply plugin: 'forge'
apply plugin: 'java'

sourceCompatibility = 1.6
targetCompatibility = 1.6

version = "1.0"
group= "com.yourname.modid" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "modid"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "eclipse"
}

dependencies {
    // you may put jars on which you depend on in ./libs
    // or you may define them like so..
    //compile "some.group:artifact:version:classifier"
    //compile "some.group:artifact:version"
      
    // real examples
    //compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    //compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // for more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

}

processResources
{
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

allprojects {
    repositories {
        all { ArtifactRepository repo ->
            if (repo instanceof MavenArtifactRepository) {
                def url = repo.url.toString()
                if (url.startsWith("http://repo1.maven.org/")) {
                    project.logger.lifecycle("Redirecting legacy URL to HTTPS: ${url}")
                    repo.url = url.replace("http://", "https://")
                }
            }
        }
    }
}